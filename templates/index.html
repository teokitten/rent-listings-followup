<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,8 92,50 8,50' fill='%23ff8c00' stroke='%23cc5500' stroke-width='3' stroke-linejoin='round'/><rect x='15' y='48' width='70' height='47' fill='%23ff8c00' stroke='%23cc5500' stroke-width='3'/><rect x='38' y='68' width='24' height='27' fill='%23cc6a00' stroke='%23aa4400' stroke-width='2'/><rect x='19' y='54' width='16' height='13' fill='%23ffe0a0' stroke='%23aa4400' stroke-width='2'/><rect x='65' y='54' width='16' height='13' fill='%23ffe0a0' stroke='%23aa4400' stroke-width='2'/></svg>">
<title>Rent Listings Follow-Up</title>
<style>
  :root {
    --bg-primary: #0d0d12;
    --bg-card: #15151f;
    --bg-input: #1e1e2a;
    --bg-sidebar: #111118;
    --border: #3d2a5a;
    --border-card: #6b3fa0;
    --accent-magenta: #e040fb;
    --accent-pink: #f48fb1;
    --accent-violet: #9c27b0;
    --accent-soft: #ce93d8;
    --text-primary: #f0e6f6;
    --text-secondary: #c8a8d8;
    --text-muted: #8a6a9a;
    --status-active-bg: #0a2010;
    --status-active-text: #69f0ae;
    --status-dead-bg: #2a0000;
    --status-dead-text: #ff6b6b;
    --danger: #cf6679;
    --toast-border: #e040fb;
    --topbar-height: 64px;
    --btn-color: #b040d0;
    --btn-hover: #ffd700;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    margin: 0;
    font-size: 16px;
  }

  a { color: var(--accent-pink); }
  button { font-family: inherit; }

  /* All buttons share identical default, hover, and focus appearance */
  .btn, .btn-primary, .btn-danger {
    background: transparent;
    border: 2px solid var(--btn-color);
    color: var(--btn-color);
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover, .btn-primary:hover, .btn-danger:hover {
    border-color: var(--btn-hover);
    color: var(--btn-hover);
    box-shadow: 0 0 0 2px #ffd70040;
  }
  .btn:focus, .btn-primary:focus, .btn-danger:focus {
    outline: none;
    border-color: var(--btn-color);
    color: var(--btn-color);
    box-shadow: none;
  }

  #btn-metro {
    color: #7a4a8a;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    align-self: center;
  }
  #btn-metro:hover { color: #ffd700; }

  /* Top bar */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  #topbar .title-group { display: flex; flex-direction: column; }
  #topbar .app-title {
    font-weight: bold;
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #topbar .app-desc {
    color: #ce93d8;
    font-size: 13px;
    margin-top: 2px;
  }
  #topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .action-sep {
    width: 1px;
    height: 28px;
    background: var(--border);
    align-self: center;
    margin: 0 4px;
  }

  /* Main content */
  #main {
    margin-left: 0;
  }
  .group-heading {
    font-size: 16px;
    color: var(--accent-soft);
    margin-bottom: 16px;
    margin-top: 32px;
  }
  .group-heading-wrap:first-child { margin-top: 0; }

  /* Listing card */
  .listing-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 10px;
    padding: 20px;
    position: relative;
    font-size: 15px;
  }
  .listing-card select option,
  .listing-card select optgroup {
    background: var(--bg-input);
    color: var(--text-primary);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .card-title {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: bold;
    flex: 1;
    min-width: 120px;
  }
  .status-badge {
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-badge.pending {
    background: #2a1500;
    color: #ffb300;
    border: 1px solid #5a3a00;
  }
  .status-badge.confirmed {
    background: #0a2010;
    color: #69f0ae;
    border: 1px solid #0a4020;
  }
  .status-badge.viewed {
    background: #001a2e;
    color: #64b5f6;
    border: 1px solid #0a3050;
  }
  .status-badge.dead {
    background: var(--status-dead-bg);
    color: var(--status-dead-text);
    border: 1px solid #5a0000;
  }
  .status-badge.backup {
    background: #1a1020;
    color: #8a6a9a;
    border: 1px solid #3d2a5a;
  }
  .date-label {
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: underline dotted;
  }
  .date-label:hover { color: var(--accent-magenta); }

  .field-block { margin-bottom: 14px; }
  .field-label {
    color: var(--text-muted);
    font-size: 12px;
    display: block;
    margin-bottom: 4px;
  }
  .listing-url {
    color: var(--accent-pink);
    font-size: 13px;
    word-break: break-all;
  }

  textarea, input[type=text], input[type=url], input[type=date], select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
  }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--accent-magenta); }

  .notes-textarea { min-height: 60px; font-size: 13px; resize: vertical; }

  .status-row, .action-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .action-row input { flex: 1; min-width: 150px; font-size: 13px; }

  .status-note-prompt {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
    width: 100%;
  }
  .status-note-prompt span { font-size: 12px; color: var(--text-muted); }
  .status-note-prompt input { width: auto; flex: 1; min-width: 150px; font-size: 13px; padding: 6px 10px; }

  .save-btn { font-size: 12px; padding: 4px 10px; }

  .log-toggle {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 0;
    text-decoration: underline;
  }
  .log-entries { margin-top: 10px; }
  .log-entry {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 4px 0;
    border-bottom: 1px solid rgba(90,26,122,0.3);
  }
  .log-add-row { margin-top: 10px; }
  .log-add-row textarea { min-height: 40px; font-size: 13px; margin-bottom: 6px; }


  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 560px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 16px;
    color: var(--text-primary);
    font-weight: bold;
    margin-bottom: 18px;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .extract-preview {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .extract-preview .thumbs { display: flex; gap: 6px; margin-top: 6px; }
  .extract-preview .thumbs img { height: 60px; object-fit: cover; border-radius: 4px; }
  .extract-spinner { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  /* Lightbox */
  .lightbox-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-overlay img {
    max-width: 95vw;
    max-height: 92vh;
    border-radius: 8px;
    cursor: default;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 12px 0 24px;
    font-size: 13px;
  }
  .pagination button {
    background: transparent;
    border: none;
    color: var(--accent-violet);
    cursor: pointer;
    font-size: 13px;
  }
  .pagination button:disabled { color: var(--text-muted); cursor: not-allowed; }
  .pagination .page-info { color: var(--text-secondary); }

  /* Toasts */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--toast-border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-primary);
    min-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast .dismiss {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-size: 14px;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 14px;
    padding: 80px 40px;
    text-align: center;
    margin: 60px auto 0;
    line-height: 1.7;
  }

  #file-input { display: none; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }
  body, select { scrollbar-color: var(--border) var(--bg-input); scrollbar-width: thin; }
  select::-webkit-scrollbar { width: 6px; }
  select::-webkit-scrollbar-track { background: var(--bg-input); }
  select::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  select::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }
  .listing-card select {
    scrollbar-color: var(--border) var(--bg-input);
    scrollbar-width: thin;
  }
  .notes-feed {
    scrollbar-color: var(--border) var(--bg-input);
    scrollbar-width: thin;
  }
  .notes-feed::-webkit-scrollbar { width: 6px; }
  .notes-feed::-webkit-scrollbar-track { background: var(--bg-input); }
  .notes-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .notes-feed::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }
  footer {
    margin-left: 0;
    text-align: center;
    padding: 1.5rem 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  footer a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  footer a:hover { color: var(--accent-soft); }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5) sepia(1) saturate(5) hue-rotate(270deg);
    cursor: pointer;
  }
  .cs-wrap { position: relative; display: inline-block; }
  .cs-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer; user-select: none; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text-primary); font-family: inherit;
    padding: 6px 10px; font-size: 13px; white-space: nowrap;
  }
  .cs-trigger:hover { border-color: var(--accent-magenta); }
  .cs-arrow { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
  .cs-dropdown {
    position: fixed; z-index: 1000;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 6px; overflow-y: auto; max-height: 240px;
    scrollbar-color: var(--border) var(--bg-input); scrollbar-width: thin;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); min-width: 160px;
  }
  .cs-dropdown::-webkit-scrollbar { width: 6px; }
  .cs-dropdown::-webkit-scrollbar-track { background: var(--bg-input); }
  .cs-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .cs-dropdown::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }
  .cs-group-label {
    font-size: 10px; color: var(--text-muted); padding: 6px 10px 2px;
    text-transform: uppercase; letter-spacing: 0.06em; pointer-events: none;
  }
  .cs-option {
    padding: 7px 12px; font-size: 13px; color: var(--text-primary);
    cursor: pointer; white-space: nowrap;
  }
  .cs-option:hover { background: rgba(224,64,251,0.12); }
  .cs-option.selected { color: var(--accent-magenta); font-weight: 600; }
  .sc-section-header {
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-muted); padding:16px 14px 6px;
  }
  .sc-item {
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; cursor:pointer; border-radius:4px; margin:1px 6px;
    font-size:13px; color:var(--text-secondary); user-select:none;
    transition:background 0.12s;
  }
  .sc-item:hover { background:rgba(224,64,251,0.08); color:var(--text-primary); }
  .sc-item.active { background:rgba(224,64,251,0.15); color:var(--accent-magenta); font-weight:600; }
  .sc-item .sc-icon { font-size:15px; flex-shrink:0; }
  .sc-item .sc-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc-item .sc-count { font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .sc-add-btn {
    margin:8px 10px 0; padding:6px 10px; font-size:12px;
    background:transparent; border:1px dashed var(--border); border-radius:6px;
    color:var(--text-muted); cursor:pointer; width:calc(100% - 20px); text-align:left;
  }
  .sc-add-btn:hover { border-color:var(--accent-magenta); color:var(--accent-magenta); }
  .sc-divider { height:1px; background:var(--border); margin:8px 10px; }

  /* Calendar */
  .sc-calendar { padding:12px; }
  .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-header span { font-size:13px; font-weight:600; color:var(--text-primary); }
  .cal-nav { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px; padding:2px 6px; }
  .cal-nav:hover { color:var(--accent-magenta); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day-label { font-size:10px; color:var(--text-muted); text-align:center; padding:2px 0; }
  .cal-day {
    font-size:11px; text-align:center; padding:3px 1px; border-radius:4px;
    cursor:default; color:var(--text-secondary);
  }
  .cal-day.other-month { color:var(--text-muted); opacity:0.4; }
  .cal-day.today { background:rgba(224,64,251,0.15); color:var(--accent-magenta); font-weight:700; }
  .cal-day.has-viewing { background:#0a4020; color:#69f0ae; font-weight:700; cursor:pointer; border-radius:50%; }
  .cal-day.has-viewing:hover { background:#0d5028; }

  .viewing-bullet {
    display:flex; flex-direction:column; gap:2px;
    padding:8px 12px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .viewing-bullet:hover { background:rgba(224,64,251,0.06); }
  .viewing-bullet .vb-datetime { font-size:11px; color:var(--accent-magenta); font-weight:600; }
  .viewing-bullet .vb-title { font-size:12px; color:var(--text-primary); }
  .viewing-bullet .vb-comment { font-size:11px; color:var(--text-muted); font-style:italic; }
  .viewing-comment-input {
    font-size:11px; padding:3px 6px; margin-top:4px; width:100%;
    background:var(--bg-input); border:1px solid var(--border);
    border-radius:4px; color:var(--text-primary); font-family:inherit;
  }

  /* Favorites heart */
  .fav-btn {
    background:none; border:none; cursor:pointer; font-size:16px;
    padding:0; line-height:1; color:var(--text-muted); flex-shrink:0;
  }
  .fav-btn.active { color:#e53935; }
  .fav-btn:hover { transform:scale(1.2); }
  .listing-card[draggable="true"] { cursor: grab; }
  .listing-card.dragging { opacity: 0.4; }
  .sc-item.drop-target { background: rgba(105,240,174,0.15); border: 1px dashed #69f0ae; color: #69f0ae; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div id="topbar">
  <div class="title-group" style="display:flex;flex-direction:row;align-items:flex-start;gap:10px;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="26" height="26" style="flex-shrink:0;margin-top:-1px;"><polygon points="50,8 92,50 8,50" fill="#ff8c00" stroke="#cc5500" stroke-width="3" stroke-linejoin="round"/><rect x="15" y="48" width="70" height="47" fill="#ff8c00" stroke="#cc5500" stroke-width="3"/><rect x="38" y="68" width="24" height="27" fill="#cc6a00" stroke="#aa4400" stroke-width="2"/><rect x="19" y="54" width="16" height="13" fill="#ffe0a0" stroke="#aa4400" stroke-width="2"/><rect x="65" y="54" width="16" height="13" fill="#ffe0a0" stroke="#aa4400" stroke-width="2"/></svg>
    <div style="display:flex;flex-direction:column;">
      <div class="app-title"><span style="background:linear-gradient(180deg,#e040fb 30%,#ce93d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;" onclick="activeShortcut=null;refreshView();buildShortcutSidebar();">Rent Listings Follow-Up</span></div>
      <div class="app-desc">Keep every apartment lead, update, and next step in one place.</div>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="btn-add"><span style="font-size:17px;line-height:1;">＋</span> Add listing</button>
    <button type="button" class="btn btn-primary" id="btn-bulk">⚡ Bulk add</button>
    <div class="action-sep"></div>
    <button type="button" class="btn" id="btn-export-pdf">🖨️ Export PDF</button>
    <button type="button" class="btn" id="btn-export-json">↓ Backup data</button>
    <button type="button" class="btn" id="btn-import-json">↑ Restore backup</button>
    <input type="file" id="file-input" accept=".json">
  </div>
</div>

<div id="app-layout" style="display:flex;margin-top:var(--topbar-height);height:calc(100vh - var(--topbar-height));overflow:hidden;">
  <div id="shortcut-sidebar" style="width:200px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;height:100%;"></div>
  <div id="content-area" style="flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow-y:auto;">
    <div id="filter-bar-wrap" style="padding:16px 24px 8px;"></div>
    <div id="main" style="padding:0 24px 24px;"></div>
    <footer>Built by <a href="https://teokitten.github.io" target="_blank" rel="noopener noreferrer">Teo Moldovanu</a></footer>
  </div>
</div>
<div id="toast-container"></div>

<script>
let allListings = [];
let filterText = '';
let filterStatus = '';
let activeShortcut = null;
let customShortcuts = JSON.parse(localStorage.getItem('rlf_shortcuts') || '[]');
let pageIndexByDate = {};

const STATUS_DEFS = {
  pending_contact:  { label: 'To contact',                   badge: '📱 To contact',                   group: 'pending' },
  to_call_back:     { label: 'Try again',                    badge: '🔄 Try again',                    group: 'pending' },
  no_response:      { label: 'Stale – no answer', badge: '🔇 Stale – no answer', group: 'dead' },
  form_submitted:   { label: 'Submitted application',        badge: '⏳ Submitted application',        group: 'pending' },
  waiting_vacancy:  { label: 'Waiting for current tenant',   badge: '⏳ Waiting for current tenant',   group: 'pending' },
  on_hold: { label: 'On hold', badge: '⏸ On hold', group: 'pending' },
  backup:           { label: 'Leave as backup',              badge: '🔖 Leave as backup',              group: 'backup'  },
  to_review: { label: 'To review', badge: '🔍 To review', group: 'pending' },

  not_pursuing:     { label: 'Missing requirements',         badge: '❌ Missing requirements',         group: 'dead'    },

const LOG_ICONS = { created: '🆕', status_change: '🔄', note: '📝', action_update: '✏️' };
const PAGE_SIZE = 8;

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDateDMY(isoDate) {
  if (!isoDate) return '';
  const [y,m,d] = isoDate.split('-');
  return `${d}.${m}.${y}`;
}
function formatLogTimestamp(ts) {
  try { return new Date(ts).toLocaleString('cs-CZ', { timeZone: 'Europe/Prague' }); } catch(e) { return ts; }
}
function domainFromUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./,''); } catch(e) { return url; }
}

function titleFromUrl(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    const parts = u.pathname.split('/').filter(Boolean);
    if (host === 'sreality.cz' && parts.length >= 5) {
      return parts[4].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }
    return host;
  } catch(e) { return url; }
}

function showToast(message, isError) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast' + (isError ? ' error' : '');
  const span = document.createElement('span');
  span.textContent = message;
  const dismiss = document.createElement('button');
  dismiss.type = 'button';
  dismiss.className = 'dismiss';
  dismiss.textContent = '✕';
  dismiss.onclick = () => toast.remove();
  toast.appendChild(span);
  toast.appendChild(dismiss);
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

async function apiFetch(url, options) {
  let resp;
  try { resp = await fetch(url, options); } catch(e) { showToast('Something went wrong – try again', true); throw e; }
  if (!resp.ok) {
    let msg = 'Something went wrong – try again';
    try { const body = await resp.json(); if (body && body.error) msg = body.error; } catch(e) {}
    showToast(msg, true);
    throw new Error(msg);
  }
  return resp.json();
}

function appConfirm(message, title = 'Are you sure?') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = '600';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.style.width = '440px';
    const titleEl = document.createElement('div');
    titleEl.className = 'modal-title';
    titleEl.textContent = title;
    box.appendChild(titleEl);
    const msg = document.createElement('div');
    msg.style.cssText = 'font-size:14px;color:var(--text-secondary);margin-bottom:8px;line-height:1.5;';
    msg.textContent = message;
    box.appendChild(msg);
    const btnRow = document.createElement('div');
    btnRow.className = 'modal-buttons';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { overlay.remove(); resolve(false); };
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'btn';
    confirmBtn.textContent = 'Delete';
    confirmBtn.onclick = () => { overlay.remove(); resolve(true); };
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } });
    const escHandler = (e) => { if (e.key === 'Escape') { overlay.remove(); resolve(false); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);
  });
}

async function loadListings() {
  const data = await apiFetch('/api/listings');
  allListings = data.listings || [];
  buildShortcutSidebar();
  renderShortcutContent();
}





function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  let listings = (filterText || filterStatus)
    ? allListings.filter(l =>
        (!filterStatus ||
          (filterStatus === '__active__' && STATUS_DEFS[l.status]?.group !== 'dead') ||
          (filterStatus === '__closed__' && STATUS_DEFS[l.status]?.group === 'dead') ||
          l.status === filterStatus) &&
        (!filterText || (
          (l.title || '').toLowerCase().includes(filterText) ||
          (l.url || '').toLowerCase().includes(filterText) ||
          (l.comments || '').toLowerCase().includes(filterText) ||
          (STATUS_DEFS[l.status]?.label || '').toLowerCase().includes(filterText)
        ))
      )
    : [...allListings];

  // Sort by most recent log entry timestamp descending
  listings.sort((a, b) => {
    const aLatest = Math.max(...(a.log || []).map(e => new Date(e.timestamp).getTime()).filter(Boolean), 0);
    const bLatest = Math.max(...(b.log || []).map(e => new Date(e.timestamp).getTime()).filter(Boolean), 0);
    return bLatest - aLatest;
  });

  if (listings.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = filterText || filterStatus ? 'No listings match your filter.' : 'No listings yet.';
    main.appendChild(empty);
    return;
  }

  const heading = document.createElement('div');
  heading.style.cssText = 'font-size:14px;color:var(--text-muted);margin-bottom:16px;';
  heading.textContent = (filterText || filterStatus)
    ? `${listings.length} of ${allListings.length} listing${allListings.length !== 1 ? 's' : ''}`
    : `${listings.length} listing${listings.length !== 1 ? 's' : ''}`;
  main.appendChild(heading);

  if (!('' in pageIndexByDate)) pageIndexByDate[''] = 0;
  const totalPages = Math.max(1, Math.ceil(listings.length / PAGE_SIZE));
  if (pageIndexByDate[''] >= totalPages) pageIndexByDate[''] = totalPages - 1;
  const page = pageIndexByDate[''];
  const pageListings = listings.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;';
  pageListings.forEach(l => grid.appendChild(renderListingCard(l)));
  main.appendChild(grid);

  if (totalPages > 1) main.appendChild(renderPagination('', page, totalPages));
}

function renderPagination(groupKey, page, totalPages) {
  const bar = document.createElement('div');
  bar.className = 'pagination';
  const goTo = (p) => { pageIndexByDate[groupKey]=p; refreshView(); document.getElementById('content-area').scrollTo({ top: 0, behavior: 'smooth' }); };
  const makeBtn = (label,disabled,onClick) => { const btn=document.createElement('button'); btn.type='button'; btn.textContent=label; btn.disabled=disabled; btn.onclick=onClick; return btn; };
  bar.appendChild(makeBtn('First',page===0,()=>goTo(0)));
  bar.appendChild(makeBtn('← Prev',page===0,()=>goTo(page-1)));
  const info=document.createElement('span'); info.className='page-info'; info.textContent=`Page ${page+1} of ${totalPages}`; bar.appendChild(info);
  bar.appendChild(makeBtn('Next →',page>=totalPages-1,()=>goTo(page+1)));
  bar.appendChild(makeBtn('Last',page>=totalPages-1,()=>goTo(totalPages-1)));
  return bar;
}

  const dateWrap = document.createElement('div');

  dateWrap.onclick = () => {
    const input = document.createElement('input'); input.type = 'date'; input.value = listing.date_added;
    dateWrap.replaceWith(input); input.focus();
    const commit = async () => { const newDate = input.value; if (newDate && newDate !== listing.date_added) { try { const updated = await apiFetch(`/api/listings/${listing.id}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({date_added:newDate})}); Object.assign(listing,updated); refreshView(); } catch(e){} } else { input.replaceWith(dateWrap); } };
    input.addEventListener('blur', commit);

      pending:   'color:#ffb300;border-color:#5a3a00;background:transparent;',
      confirmed: 'color:#69f0ae;border-color:#0a4020;background:transparent;',
      viewed:    'color:#64b5f6;border-color:#0a3050;background:transparent;',

    a.target = '_blank';
    a.textContent = listing.url;
    a.style.cssText = 'font-size:11px;color:var(--text-muted);word-break:break-all;';

  if (listing.status === 'viewing_scheduled') {

      onChange: async (val) => {
        try {
          const updated = await apiFetch(`/api/listings/${listing.id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ viewing_time: val }) });

          showToast('Viewing time saved');

    viewingDateWrap.appendChild(viewingTimeInput);
    card.appendChild(viewingDateWrap);
  }

  const notesBlock = document.createElement('div');
  notesBlock.className = 'field-block';
  const notesFeed = document.createElement('div');

  notesFeed.style.cssText = 'height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);padding:8px 10px;font-size:13px;margin-bottom:8px;';

  const noteInput = document.createElement('input');
  noteInput.type = 'text';
  noteInput.placeholder = 'Add a note…';
  noteInput.style.cssText = 'flex:1;font-size:13px;padding:6px 10px;';
  const noteRow = document.createElement('div');
  noteRow.style.cssText = 'display:flex;gap:6px;';
  const commentMigrationsInFlight = new Set();
  function buildNotesFeed() {
    notesFeed.innerHTML = '';
    const logNotes = (listing.log || []).filter(e => e.type === 'note').slice().reverse();
    const allNotes = [];
    logNotes.forEach(e => allNotes.push({ id: e.timestamp, timestamp: e.timestamp, content: e.content, editable: true, isComment: false }));

        finally { commentMigrationsInFlight.delete(listing.id); }

      if (!commentMigrationsInFlight.has(listing.id)) {
        commentMigrationsInFlight.add(listing.id);
        migrateComment();
      }
    }

    if (allNotes.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-muted);font-style:italic;font-size:12px;pointer-events:none;';

        notesFeed.onclick = null;
        notesFeed.style.cursor = '';
        notesFeed.innerHTML = '';
        const editInput = document.createElement('textarea');
        editInput.placeholder = 'Type a note and press Enter…';
        editInput.rows = 3;
        editInput.style.cssText = 'width:100%;font-size:13px;padding:4px 8px;resize:vertical;background:transparent;border:none;outline:none;color:var(--text-primary);font-family:inherit;';
        notesFeed.appendChild(editInput);
        editInput.focus();
        const save = async () => {
          const content = editInput.value.trim();
          if (!content) { buildNotesFeed(); return; }
          try {
            const updated = await apiFetch(`/api/listings/${listing.id}/log`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ content }) });
            Object.assign(listing, updated);
          } catch(e) {}
          buildNotesFeed();
        };
        editInput.addEventListener('blur', save);
        editInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editInput.removeEventListener('blur', save); save(); }
          if (e.key === 'Escape') { editInput.removeEventListener('blur', save); buildNotesFeed(); }
        });
      };
      return;
    }

    let lastDate = null;
    allNotes.forEach(note => {
      const dateStr = note.timestamp
        ? formatDateDMY(new Date(note.timestamp).toLocaleDateString('en-CA', { timeZone: 'Europe/Prague' }))
        : formatDateDMY(listing.date_added);

      if (dateStr !== lastDate) {

        const dl = document.createElement('span'); dl.style.cssText = 'font-size:10px;color:var(--text-muted);white-space:nowrap;'; dl.textContent = dateStr;
        const l2 = document.createElement('div'); l2.style.cssText = 'flex:1;height:1px;background:var(--border);';
        divider.appendChild(l1); divider.appendChild(dl); divider.appendChild(l2);
        notesFeed.appendChild(divider);
        lastDate = dateStr;
      }

      const row = document.createElement('div');
      row.style.cssText = 'padding:4px 0;color:var(--text-secondary);line-height:1.5;cursor:pointer;border-radius:4px;';

      const timeStr = note.timestamp
        ? new Date(note.timestamp).toLocaleTimeString('cs-CZ', { timeZone: 'Europe/Prague', hour: '2-digit', minute: '2-digit' })
        : '';
      const timeSpan = document.createElement('span');
      timeSpan.style.cssText = 'font-size:10px;color:var(--text-muted);margin-right:8px;';
      timeSpan.textContent = timeStr;
      const contentSpan = document.createElement('span');
      contentSpan.textContent = note.content;

      row.appendChild(timeSpan);
      row.appendChild(contentSpan);

      const deleteNoteBtn = document.createElement('span');
      deleteNoteBtn.style.cssText = 'float:right;cursor:pointer;color:var(--text-muted);font-size:11px;padding:0 4px;';
      deleteNoteBtn.title = 'Delete note';
      deleteNoteBtn.textContent = '✕';
      deleteNoteBtn.onclick = async (e) => {
        e.stopPropagation();
        if (!await appConfirm('Delete this note? This cannot be undone.', 'Delete Note')) return;
        try {
          if (note.isComment) {
            const updated = await apiFetch(`/api/listings/${listing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comments: '' }) });
            Object.assign(listing, updated);
          } else {
            listing.log = (listing.log || []).filter(e => e.timestamp !== note.id);
            const updated = await apiFetch(`/api/listings/${listing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ log: listing.log }) });
            Object.assign(listing, updated);
          }
          buildNotesFeed();
          showToast('Note deleted');
        } catch (e) {}
      };
      row.appendChild(deleteNoteBtn);

      row.onclick = () => {
        const editInput = document.createElement('textarea');
        editInput.value = note.content;
        editInput.rows = 3;
        editInput.style.cssText = 'width:100%;font-size:13px;padding:4px 8px;resize:vertical;';
        row.replaceWith(editInput);
        editInput.focus();
        editInput.select();
        const commitEdit = async () => {
          const newContent = editInput.value.trim();
          if (!newContent || newContent === note.content) { buildNotesFeed(); return; }
          if (note.isComment) {
            try {
              const updated = await apiFetch(`/api/listings/${listing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comments: newContent }) });
              Object.assign(listing, updated);
              showToast('Note updated');
            } catch (e) {}
          } else {
            const logEntry = (listing.log || []).find(e => e.timestamp === note.id);
            if (logEntry) {
              logEntry.content = newContent;

                await apiFetch(`/api/listings/${listing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ log: listing.log }) });
                showToast('Note updated');
              } catch (e) {}
            }
          }
          buildNotesFeed();
        };
        editInput.addEventListener('blur', commitEdit);
        editInput.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') buildNotesFeed();
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitEdit(); }
        });
      };

      notesFeed.appendChild(row);
    });
    notesFeed.style.cursor = '';
    notesFeed.onclick = null;
    noteRow.style.display = 'flex';
  }

  const notesLabel = document.createElement('span');
  notesLabel.className = 'field-label';
  notesLabel.textContent = 'Notes';
  notesBlock.appendChild(notesLabel);
  notesBlock.appendChild(notesFeed);

  const addNoteBtn = document.createElement('button');
  addNoteBtn.type = 'button';
  addNoteBtn.className = 'btn save-btn';
  addNoteBtn.textContent = 'Add note';
  addNoteBtn.onclick = async () => {

    if (!content) return;
    try {
      const updated = await apiFetch(`/api/listings/${listing.id}/log`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
      Object.assign(listing, updated);
      noteInput.value = '';
      buildNotesFeed();
      showToast('Note added');
    } catch (e) {}
  };
  noteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addNoteBtn.onclick(); });
  noteRow.appendChild(noteInput);
  noteRow.appendChild(addNoteBtn);
  notesBlock.appendChild(noteRow);
  buildNotesFeed();
  card.appendChild(notesBlock);


  return card;
}

const openMetroMap = () => {
  const ZOOM_SCALES=[1,1.6,2.4]; let zoomLevel=0,translateX=0,translateY=0,isDragging=false,hasDragged=false,startX=0,startY=0,startTx=0,startTy=0;

  img.addEventListener('dragstart',(e)=>e.preventDefault());
  function clampTranslate(){ if(zoomLevel===0){translateX=0;translateY=0;return;} const scale=ZOOM_SCALES[zoomLevel],imgW=img.offsetWidth,imgH=img.offsetHeight,viewW=overlay.clientWidth,viewH=overlay.clientHeight,maxX=Math.max(0,(scale*imgW-viewW)/2),maxY=Math.max(0,(scale*imgH-viewH)/2); translateX=Math.max(-maxX,Math.min(maxX,translateX)); translateY=Math.max(-maxY,Math.min(maxY,translateY)); }
  function updateTransform(animate){ img.style.transition=animate?'transform 0.15s ease':'none'; img.style.transform=`translate(${translateX}px,${translateY}px) scale(${ZOOM_SCALES[zoomLevel]})`; }
  function setZoom(level){ zoomLevel=Math.max(0,Math.min(2,level)); if(zoomLevel===0){translateX=0;translateY=0;} clampTranslate(); updateTransform(true); img.style.cursor=zoomLevel===0?'zoom-in':'grab'; }
  function onMouseMove(e){ if(!isDragging) return; const dx=e.clientX-startX,dy=e.clientY-startY; if(Math.abs(dx)>4||Math.abs(dy)>4) hasDragged=true; if(zoomLevel>0){translateX=startTx+dx;translateY=startTy+dy;clampTranslate();updateTransform(false);} }
  function onMouseUp(){ if(!isDragging) return; isDragging=false; if(!hasDragged) setZoom((zoomLevel+1)%3); else img.style.cursor=zoomLevel===0?'zoom-in':'grab'; }
  img.addEventListener('mousedown',(e)=>{ e.preventDefault();e.stopPropagation();isDragging=true;hasDragged=false;startX=e.clientX;startY=e.clientY;startTx=translateX;startTy=translateY;if(zoomLevel>0)img.style.cursor='grabbing'; });
  img.addEventListener('click',(e)=>e.stopPropagation());

  function closeOverlay(){ window.removeEventListener('mousemove',onMouseMove);window.removeEventListener('mouseup',onMouseUp);document.removeEventListener('keydown',escHandler);overlay.remove(); }

function cleanupText(text) {
  if (!text) return text;
  return text
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/\s+([.,!?;:])/g, '$1')
    .replace(/(^|[.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase())
    .replace(/^([a-z])/, (m) => m.toUpperCase())
    .replace(/([^.!?])$/, '$1.');
}

function parseBulkText(text) {
  // Strip WhatsApp timestamp headers: [M/D, H:MM AM/PM] Name: (with optional year, seconds, 24h)
  text = text.replace(/\[\d+\/\d+(?:\/\d+)?,\s*\d+:\d+(?::\d+)?\s*(?:AM|PM)?\]\s*[^:\n]+:\s*/gi, '\n');

  // Split into lines, trim each
  const lines = text.split('\n').map(l => l.trim());

  // Group lines into blocks: a new block starts when a URL appears
  // Each block = [context lines before URL] + [URL line] + [context lines after URL until next URL or blank separator]
  const urlRe = /https?:\/\/[^\s]+/;
  const blocks = []; // { url, contextLines[] }
  let i = 0;

  while (i < lines.length) {
    const urlMatch = lines[i].match(urlRe);
    if (urlMatch) {
      const url = urlMatch[0];
      // Collect context: up to 3 lines before (that have no URL themselves)
      const before = [];
      for (let b = i - 1; b >= Math.max(0, i - 3); b--) {
        if (lines[b] === '') break;
        if (!urlRe.test(lines[b])) before.unshift(lines[b]);
      }
      // Text on same line as URL (before or after the URL)
      const sameLine = lines[i].replace(url, '').replace(/^\d+[\.\)]\s*/, '').trim();
      if (sameLine) before.push(sameLine);
      // Up to 3 lines after (until next URL or empty separator)
      const after = [];
      let j = i + 1;
      while (j < lines.length && j < i + 4) {
        if (urlRe.test(lines[j])) break;
        if (lines[j]) after.push(lines[j]);
        else break;
        j++;
      }
      const contextLines = [...before, ...after];
      blocks.push({ url, contextLines });
      i = j;
    } else {
      i++;
    }
  }

  // Deduplicate by URL, merging context
  const seen = {};
  blocks.forEach(b => {
    if (!seen[b.url]) seen[b.url] = { url: b.url, contextLines: [] };
    seen[b.url].contextLines.push(...b.contextLines);
  });

  return Object.values(seen).map(({ url, contextLines }) => {
    // Remove duplicate context lines and clean up
    const uniqueLines = [...new Set(contextLines.map(l => l.replace(/^\d+[\.\)]\s*/, '').trim()).filter(Boolean))];
    const comment = uniqueLines.join(' ').replace(/\s+/g, ' ').trim();
    const existing = allListings.find(l => l.url === url);
    const suggestedStatus = detectStatusFromText(comment);
    if (existing) {
      return { type: 'update', url, description: comment, suggestedStatus };
    } else {
      return { type: 'new', url, comments: comment, suggestedStatus: 'pending_contact' };
    }
  });
}

function detectStatusFromText(text){
  const t=text.toLowerCase();
  if(t.includes('rented')||t.includes('already reserved')||t.includes("it's rented")||t.includes('reserved')) return 'rented_out';
  if(t.includes('no foreigner')||t.includes('not accept')||t.includes('only czech')||t.includes('only local')) return 'no_foreigners';
  if((t.includes('no answer')||t.includes('no response'))&&(t.includes('called')||t.includes('calling')||t.includes('times'))) return 'no_response';
  if(t.includes('current tenant')||t.includes('people living')||t.includes('tenant moving')||t.includes('start the viewing')||t.includes('week between')||t.includes('earliest will')) return 'waiting_vacancy';
  if(t.includes('sent email')||t.includes('i sent')||(t.includes('waiting for')&&t.includes('reply'))||t.includes('sent an email')||t.includes('form')) return 'form_submitted';
  if(t.includes('viewing')&&(t.includes('planned')||t.includes('scheduled')||t.includes('appointment'))) return 'viewing_scheduled';
  if (t.includes('call back') || t.includes('call me back') || t.includes('will call') || t.includes('call again')) return 'to_call_back';
  if (t.includes('backup') || t.includes('leave it as backup') || t.includes('keep it as backup')) return 'backup';
  return 'pending_contact';
}

    bulkPreviewItems.forEach(item=>resultsDiv.appendChild(renderBulkPreviewItem(item)));

  };
  confirmBtn.onclick=async()=>{
    confirmBtn.disabled=true; confirmBtn.textContent='Importing…';
    const today=new Date().toISOString().slice(0,10);
    let newCount=0,updateCount=0,failCount=0;
    const createdForExtraction=[];
    for(const item of bulkPreviewItems){
      const selectedStatus=item.selectEl?item.selectEl.getValue():item.suggestedStatus;
      try{
        if(item.type==='new'){
          const dup = allListings.find(l => l.url === item.url);
          if (dup) { failCount++; continue; }
          const resp=await fetch('/api/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:item.url,date_added:today,comments:item.comments,status:selectedStatus})});
          if(!resp.ok) throw new Error('create failed');
          const listing=await resp.json(); allListings.push(listing); newCount++; createdForExtraction.push(listing);
        }else{
          const existing=allListings.find(l=>l.url===item.url);
          if(existing){
            const resp=await fetch(`/api/listings/${existing.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:selectedStatus,note:item.description})});
            if(!resp.ok) throw new Error('update failed');
            const updated=await resp.json(); Object.assign(existing,updated); updateCount++;
          }else{
            const resp=await fetch('/api/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:item.url,date_added:today,comments:item.description,status:selectedStatus})});
            if(!resp.ok) throw new Error('create failed');
            const listing=await resp.json(); allListings.push(listing); newCount++; createdForExtraction.push(listing);
          }
        }
      }catch(e){ failCount++; }
    }
    overlay.remove(); refreshView();
    let msg=`Imported ${newCount} listings, updated ${updateCount} listings`;
    if(failCount>0) msg+=` (${failCount} failed)`;
    showToast(msg,failCount>0);
    createdForExtraction.forEach(listing=>{
      fetch(`/api/extract?url=${encodeURIComponent(listing.url)}`).then(r=>r.json()).then(result=>{
        if(!result) return;
        if(!result.title&&!result.price&&!(result.images&&result.images.length)) return;
        return fetch(`/api/listings/${listing.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:result.title,price:result.price,images:result.images})}).then(r2=>r2.json()).then(updated=>{ Object.assign(listing,updated); refreshCard(listing); });
      }).catch(()=>{});
    });
  };
  overlay.appendChild(box);
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  const escHandler=(e)=>{ if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',escHandler);} };
  document.addEventListener('keydown',escHandler); document.body.appendChild(overlay); textarea.focus();
}

let _csOpenDropdown = null;
document.addEventListener('click', () => {
  if (_csOpenDropdown) { _csOpenDropdown.remove(); _csOpenDropdown = null; }
});

function createCustomSelect({ options, value, onChange, triggerStyle = '', placeholder = 'Select…' }) {
  const wrap = document.createElement('div');
  wrap.className = 'cs-wrap';

  const trigger = document.createElement('div');
  trigger.className = 'cs-trigger';
  if (triggerStyle) trigger.style.cssText = triggerStyle;

  const labelSpan = document.createElement('span');
  const arrowSpan = document.createElement('span');
  arrowSpan.className = 'cs-arrow';
  arrowSpan.textContent = '▾';
  trigger.appendChild(labelSpan);
  trigger.appendChild(arrowSpan);
  wrap.appendChild(trigger);

  let currentValue = value;

  function getLabel(val) {
    const opt = options.find(o => o.value === val);
    return opt ? opt.label : placeholder;
  }

  function updateLabel() {
    labelSpan.textContent = getLabel(currentValue);
  }
  updateLabel();

  function openDropdown() {
    if (_csOpenDropdown) { _csOpenDropdown.remove(); _csOpenDropdown = null; }
    const dropdown = document.createElement('div');
    dropdown.className = 'cs-dropdown';
    _csOpenDropdown = dropdown;

    const rect = trigger.getBoundingClientRect();
    dropdown.style.width = Math.max(rect.width, 180) + 'px';

    // Check if options have two groups (Active + Closed) – render two columns
    const groupIndices = options.reduce((acc, opt, i) => { if (opt.type === 'group') acc.push(i); return acc; }, []);
    const hasTwoGroups = groupIndices.length === 2;

    if (hasTwoGroups) {
      dropdown.style.cssText += 'display:flex;flex-direction:row;min-width:420px;max-height:none;overflow:visible;';
      const [g1Start, g2Start] = groupIndices;
      const col1Opts = options.slice(g1Start, g2Start);
      const col2Opts = options.slice(g2Start);

      [col1Opts, col2Opts].forEach((colOpts, colIdx) => {
        const col = document.createElement('div');
        col.style.cssText = 'flex:1;display:flex;flex-direction:column;overflow-y:auto;max-height:300px;scrollbar-color:var(--border) var(--bg-input);scrollbar-width:thin;';
        colOpts.forEach(opt => {
          if (opt.type === 'group') {
            const gl = document.createElement('div');
            gl.className = 'cs-group-label';
            gl.textContent = opt.label;
            col.appendChild(gl);
          } else {
            const item = document.createElement('div');
            item.className = 'cs-option' + (opt.value === currentValue ? ' selected' : '');
            item.textContent = opt.label;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              currentValue = opt.value;
              updateLabel();
              dropdown.remove();
              _csOpenDropdown = null;
              onChange(opt.value);
            });
            col.appendChild(item);
          }
        });
        dropdown.appendChild(col);
        if (colIdx === 0) {
          const sep = document.createElement('div');
          sep.style.cssText = 'width:1px;background:var(--border);margin:8px 0;flex-shrink:0;';
          dropdown.appendChild(sep);
        }
      });
    } else {
      options.forEach(opt => {
        if (opt.type === 'group') {
          const gl = document.createElement('div');
          gl.className = 'cs-group-label';
          gl.textContent = opt.label;
          dropdown.appendChild(gl);
        } else {
          const item = document.createElement('div');
          item.className = 'cs-option' + (opt.value === currentValue ? ' selected' : '');
          item.textContent = opt.label;
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            currentValue = opt.value;
            updateLabel();
            dropdown.remove();
            _csOpenDropdown = null;
            onChange(opt.value);
          });
          dropdown.appendChild(item);
        }
      });
    }

    document.body.appendChild(dropdown);

    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < 260 && rect.top > 260) {
      dropdown.style.top = (rect.top - Math.min(dropdown.scrollHeight, 240) - 4) + 'px';
    } else {
      dropdown.style.top = (rect.bottom + 4) + 'px';
    }
    dropdown.style.left = rect.left + 'px';

    requestAnimationFrame(() => {
      const dRect = dropdown.getBoundingClientRect();
      if (dRect.right > window.innerWidth - 8) {
        dropdown.style.left = Math.max(8, window.innerWidth - dRect.width - 8) + 'px';
      }
    });

    const sel = dropdown.querySelector('.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  trigger.addEventListener('click', (e) => { e.stopPropagation(); openDropdown(); });

  wrap.getValue = () => currentValue;
  wrap.setValue = (val) => { currentValue = val; updateLabel(); };
  wrap.setTriggerStyle = (css) => { trigger.style.cssText = css; };

  return wrap;
}

function statusOptions(includeActiveGroup = true, includeClosedGroup = true) {
  const opts = [];
  if (includeActiveGroup) {
    opts.push({ type: 'group', label: 'Active' });
    Object.entries(STATUS_DEFS).filter(([,d]) => d.group !== 'dead').forEach(([key, def]) => {
      opts.push({ value: key, label: def.label });
    });
  }
  if (includeClosedGroup) {
    opts.push({ type: 'group', label: 'Closed' });
    Object.entries(STATUS_DEFS).filter(([,d]) => d.group === 'dead').forEach(([key, def]) => {
      opts.push({ value: key, label: def.label });
    });
  }
  return opts;
}

function buildShortcutSidebar() {

  const viewingCount = allListings.filter(l => l.status === 'viewing_scheduled' && l.viewing_date).length;
  sidebar.appendChild(makeSidebarItem('📅', 'Scheduled visits', 'viewing', viewingCount));

  const favCount = allListings.filter(l => l.is_favorite).length;
  sidebar.appendChild(makeSidebarItem('❤️', 'Favorites', 'favorites', favCount));

  const backupCount = allListings.filter(l => l.status === 'backup').length;
  sidebar.appendChild(makeSidebarItem('🔖', 'Backups', 'backups', backupCount));

  sidebar.appendChild(makeSidebarItem('🔍', 'To review', 'toreview', reviewCount));

  const div2 = document.createElement('div'); div2.className = 'sc-divider';
  sidebar.appendChild(div2);

  if (customShortcuts.length > 0) {
    const customHeader = document.createElement('div');
    customHeader.className = 'sc-section-header';
    customHeader.textContent = 'My shortcuts';
    sidebar.appendChild(customHeader);

    customShortcuts.forEach(sc => {
      const count = sc.listingIds.filter(id => allListings.find(l => l.id === id)).length;
      const item = makeSidebarItem('📁', sc.name, 'custom:' + sc.id, count);

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        item.classList.add('drop-target');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drop-target'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drop-target');
        const listingId = e.dataTransfer.getData('text/plain');
        if (!listingId) return;
        if (!sc.listingIds.includes(listingId)) {
          sc.listingIds.push(listingId);
          saveCustomShortcuts();
          buildShortcutSidebar();
          showToast(`Added to "${sc.name}"`);
        } else {
          showToast(`Already in "${sc.name}"`);
        }
      });

      const editIcon = document.createElement('span');
      editIcon.textContent = '✎';
      editIcon.title = 'Rename shortcut';
      editIcon.style.cssText = 'font-size:11px;color:var(--text-muted);cursor:pointer;padding:0 2px;opacity:0;transition:opacity 0.1s;flex-shrink:0;';
      editIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        const label = item.querySelector('.sc-label');
        const input = document.createElement('input');
        input.value = sc.name;
        input.style.cssText = 'font-size:13px;padding:0 4px;width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);';
        label.replaceWith(input);
        editIcon.remove();
        input.focus(); input.select();
        const commit = () => {
          const newName = input.value.trim();
          if (newName) sc.name = newName;
          saveCustomShortcuts();
          buildShortcutSidebar();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') buildShortcutSidebar(); });
      });
      item.appendChild(editIcon);

      const deleteIcon = document.createElement('span');
      deleteIcon.textContent = '✕';
      deleteIcon.title = 'Remove shortcut';
      deleteIcon.style.cssText = 'font-size:11px;color:var(--danger);cursor:pointer;padding:0 2px;opacity:0;transition:opacity 0.1s;flex-shrink:0;';
      deleteIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        appConfirm(`Remove shortcut "${sc.name}"? This cannot be undone.`, 'Remove shortcut').then(confirmed => {
          if (!confirmed) return;
          customShortcuts = customShortcuts.filter(s => s.id !== sc.id);
          if (activeShortcut === 'custom:' + sc.id) activeShortcut = null;
          saveCustomShortcuts();
          buildShortcutSidebar();
          renderShortcutContent();
        });
      });
      item.appendChild(deleteIcon);

      item.addEventListener('mouseenter', () => { editIcon.style.opacity = '1'; deleteIcon.style.opacity = '1'; });
      item.addEventListener('mouseleave', () => { editIcon.style.opacity = '0'; deleteIcon.style.opacity = '0'; });

      sidebar.appendChild(item);
    });
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'sc-add-btn';
  addBtn.textContent = '+ New shortcut';
  addBtn.onclick = () => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.style.width = '360px';
    const title = document.createElement('div');
    title.className = 'modal-title';
    title.textContent = 'New shortcut';
    box.appendChild(title);
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Folder name';
    input.style.cssText = 'width:100%;font-size:14px;padding:8px 12px;margin-bottom:8px;';
    box.appendChild(input);
    const btnRow = document.createElement('div');
    btnRow.className = 'modal-buttons';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => overlay.remove();
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'btn btn-primary';
    confirmBtn.textContent = 'Create';
    confirmBtn.onclick = () => {
      const name = input.value.trim();
      if (!name) return;
      customShortcuts.push({ id: Date.now().toString(), name, listingIds: [] });
      saveCustomShortcuts();
      overlay.remove();
      buildShortcutSidebar();
    };
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    const esc = e => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); } };
    document.addEventListener('keydown', esc);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') confirmBtn.onclick(); });
    input.focus();
  };
  sidebar.appendChild(addBtn);
}

function makeSidebarItem(icon, label, key, count) {
  const item = document.createElement('div');
  item.className = 'sc-item' + (activeShortcut === key ? ' active' : '');
  item.innerHTML = `<span class="sc-icon">${icon}</span><span class="sc-label">${escapeHtml(label)}</span><span class="sc-count">${count || ''}</span>`;
  item.title = label;
  item.onclick = () => {
    activeShortcut = key;
    buildShortcutSidebar();
    renderShortcutContent();
  };
  return item;
}

function saveCustomShortcuts() {
  localStorage.setItem('rlf_shortcuts', JSON.stringify(customShortcuts));
}

function renderShortcutContent() {
  const filterWrap = document.getElementById('filter-bar-wrap');
  const main = document.getElementById('main');

  if (!activeShortcut) {
    filterWrap.style.display = '';
    renderMain();
    return;
  }

  filterWrap.style.display = 'none';
  main.innerHTML = '';

  if (activeShortcut === 'viewing') {
    renderScheduledVisits(main);
  } else if (activeShortcut === 'favorites') {
    renderFavorites(main);
  } else if (activeShortcut === 'backups') {
    renderFilteredShortcut(main, 'Backups', l => l.status === 'backup');
  } else if (activeShortcut === 'toreview') {
    renderFilteredShortcut(main, 'To review', l => l.status === 'to_review');
  } else if (activeShortcut.startsWith('custom:')) {
    const id = activeShortcut.replace('custom:', '');
    renderCustomFolder(main, id);
  }
}

  if (resetPage) pageIndexByDate[''] = 0;
  buildShortcutSidebar();
  if (activeShortcut) renderShortcutContent();
  else renderMain();
}

let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function renderScheduledVisits(container) {
  container.innerHTML = '';

  const viewings = allListings
    .filter(l => l.status === 'viewing_scheduled' && l.viewing_date)
    .sort((a, b) => {
      const da = a.viewing_date + (a.viewing_time || '00:00');
      const db = b.viewing_date + (b.viewing_time || '00:00');
      return da.localeCompare(db);
    });

  const viewingDates = new Set(viewings.map(v => v.viewing_date));

  const calOuter = document.createElement('div');
  calOuter.style.cssText = 'display:flex;justify-content:center;margin:24px 0 32px;';
  const calWrap = document.createElement('div');
  calWrap.className = 'sc-calendar';
  calWrap.style.cssText = 'width:400px;';
  calOuter.appendChild(calWrap);
  container.appendChild(calOuter);

  const now = new Date();
  const renderCal = () => {
    calWrap.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'cal-header';
    const prev = document.createElement('button'); prev.className = 'cal-nav'; prev.textContent = '‹';
    prev.onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); };
    const next = document.createElement('button'); next.className = 'cal-nav'; next.textContent = '›';
    next.onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); };
    const label = document.createElement('span');
    label.textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    header.appendChild(prev); header.appendChild(label); header.appendChild(next);
    calWrap.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:4px;';

    ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => {
      const dl = document.createElement('div');
      dl.className = 'cal-day-label';
      dl.style.cssText = 'font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0;font-weight:600;';
      dl.textContent = d;
      grid.appendChild(dl);
    });

    const firstDay = new Date(calYear, calMonth, 1);
    const startDow = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const prevDays = new Date(calYear, calMonth, 0).getDate();

    for (let i = 0; i < startDow; i++) {
      const d = document.createElement('div');
      d.className = 'cal-day other-month';
      d.style.cssText = 'font-size:12px;text-align:center;padding:6px 2px;color:var(--text-muted);opacity:0.3;';
      d.textContent = prevDays - startDow + 1 + i;
      grid.appendChild(d);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const isoDate = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = d === now.getDate() && calMonth === now.getMonth() && calYear === now.getFullYear();
      const hasViewing = viewingDates.has(isoDate);
      const cell = document.createElement('div');
      cell.style.cssText = `font-size:12px;text-align:center;padding:6px 2px;border-radius:50%;cursor:${hasViewing ? 'pointer' : 'default'};font-weight:${hasViewing || isToday ? '700' : '400'};background:${hasViewing ? '#0a4020' : isToday ? 'rgba(224,64,251,0.15)' : 'transparent'};color:${hasViewing ? '#69f0ae' : isToday ? 'var(--accent-magenta)' : 'var(--text-secondary)'};`;
      cell.textContent = d;
      if (hasViewing) {
        cell.title = 'Viewing scheduled';
        cell.onmouseover = () => cell.style.background = '#0d5028';
        cell.onmouseout = () => cell.style.background = '#0a4020';
        cell.onclick = () => {
          const el = document.getElementById('vb-' + isoDate);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
      }
      grid.appendChild(cell);
    }
    const remaining = (7 - (startDow + daysInMonth) % 7) % 7;
    for (let i = 1; i <= remaining; i++) {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:12px;text-align:center;padding:6px 2px;color:var(--text-muted);opacity:0.3;';
      d.textContent = i;
      grid.appendChild(d);
    }
    calWrap.appendChild(grid);
  };
  renderCal();

  const listOuter = document.createElement('div');
  listOuter.style.cssText = 'display:flex;justify-content:center;';
  const list = document.createElement('div');
  list.style.cssText = 'width:600px;';
  listOuter.appendChild(list);
  container.appendChild(listOuter);

  if (viewings.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.style.cssText = 'text-align:center;color:var(--text-muted);padding:40px;';
    empty.textContent = 'No viewings scheduled yet.';
    list.appendChild(empty);
    return;
  }

  const byMonth = {};
  viewings.forEach(l => {
    const key = l.viewing_date.slice(0, 7);
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(l);
  });

  Object.entries(byMonth).forEach(([monthKey, monthViewings]) => {
    const [y, m] = monthKey.split('-');
    const monthLabel = new Date(parseInt(y), parseInt(m) - 1, 1)
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
      .toUpperCase();

    const monthSep = document.createElement('div');
    monthSep.style.cssText = 'display:flex;align-items:center;gap:12px;margin:20px 0 10px;';
    const sepLine1 = document.createElement('div'); sepLine1.style.cssText = 'height:1px;background:var(--border);width:20px;';
    const sepLabel = document.createElement('span'); sepLabel.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--text-muted);white-space:nowrap;';
    sepLabel.textContent = monthLabel;
    const sepLine2 = document.createElement('div'); sepLine2.style.cssText = 'flex:1;height:1px;background:var(--border);';
    monthSep.appendChild(sepLine1); monthSep.appendChild(sepLabel); monthSep.appendChild(sepLine2);
    list.appendChild(monthSep);

    monthViewings.forEach(l => {
      const bullet = document.createElement('div');
      bullet.id = 'vb-' + l.viewing_date;
      bullet.style.cssText = 'display:grid;grid-template-columns:100px 80px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--border);cursor:default;border-radius:4px;';
      bullet.onmouseover = () => bullet.style.background = 'rgba(224,64,251,0.05)';
      bullet.onmouseout = () => bullet.style.background = 'transparent';

      const dateCell = document.createElement('div');
      dateCell.style.cssText = 'font-size:13px;font-weight:600;color:var(--accent-magenta);white-space:nowrap;';
      const isPast = l.viewing_date < now.toISOString().slice(0,10);
      dateCell.textContent = formatDateDMY(l.viewing_date) + (isPast ? ' ✓' : '');

      const timeCell = document.createElement('div');
      timeCell.style.cssText = 'font-size:13px;color:var(--text-secondary);white-space:nowrap;';
      timeCell.textContent = l.viewing_time || '–';

      const titleCell = document.createElement('div');
      titleCell.style.cssText = 'font-size:13px;min-width:0;';
      const a = document.createElement('a');
      a.href = l.url; a.target = '_blank';
      a.textContent = l.title || titleFromUrl(l.url);
      a.style.cssText = 'color:var(--text-primary);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      a.onmouseover = () => a.style.color = 'var(--accent-pink)';
      a.onmouseout = () => a.style.color = 'var(--text-primary)';
      titleCell.appendChild(a);

      const commentCell = document.createElement('div');
      commentCell.style.cssText = 'font-size:11px;color:var(--text-muted);min-width:120px;text-align:right;';
      const existingComment = l.viewing_comment || '';

      const renderComment = () => {
        commentCell.innerHTML = '';
        if (existingComment || l.viewing_comment) {
          const vc = document.createElement('span');
          vc.style.cssText = 'font-style:italic;cursor:pointer;';
          vc.textContent = l.viewing_comment || existingComment;
          vc.onclick = showCommentInput;
          commentCell.appendChild(vc);
        } else {
          const add = document.createElement('span');
          add.textContent = '+ comment';
          add.style.cssText = 'cursor:pointer;color:var(--text-muted);';
          add.onmouseover = () => add.style.color = 'var(--accent-magenta)';
          add.onmouseout = () => add.style.color = 'var(--text-muted)';
          add.onclick = showCommentInput;
          commentCell.appendChild(add);
        }
      };

      const showCommentInput = () => {
        commentCell.innerHTML = '';
        const input = document.createElement('input');
        input.style.cssText = 'font-size:11px;padding:3px 6px;width:140px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-family:inherit;text-align:left;';
        input.placeholder = 'Add comment…';
        input.value = l.viewing_comment || '';
        commentCell.appendChild(input);
        input.focus();
        const save = async () => {
          try {
            const updated = await apiFetch(`/api/listings/${l.id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ viewing_comment: input.value.trim() }) });
            Object.assign(l, updated);
          } catch(e) {}
          renderComment();
        };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') renderComment(); });
      };

      renderComment();

      bullet.appendChild(dateCell);
      bullet.appendChild(timeCell);
      bullet.appendChild(titleCell);
      bullet.appendChild(commentCell);
      list.appendChild(bullet);
    });
  });
}

function renderFilteredShortcut(container, title, filterFn) {
  const listings = allListings.filter(filterFn);
  if (listings.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = `No listings in ${title} yet.`;
    container.appendChild(empty);
    return;
  }
  const heading = document.createElement('div');
  heading.style.cssText = 'font-size:14px;font-weight:600;color:var(--text-muted);padding:0 0 16px;text-transform:uppercase;letter-spacing:0.06em;';
  heading.textContent = `${title} – ${listings.length} listing${listings.length !== 1 ? 's' : ''}`;
  container.appendChild(heading);
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;';
  listings.forEach(l => grid.appendChild(renderListingCard(l, { noDelete: true })));
  container.appendChild(grid);
}

function renderFavorites(container) {
  const favs = allListings.filter(l => l.is_favorite);
  if (favs.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No favorites yet. Click the ♡ on any listing to add it here.';
    container.appendChild(empty);
    return;
  }
  const heading = document.createElement('div');
  heading.style.cssText = 'font-size:14px;font-weight:600;color:var(--text-muted);padding:0 0 16px;text-transform:uppercase;letter-spacing:0.06em;';
  heading.textContent = `${favs.length} favorite${favs.length !== 1 ? 's' : ''}`;
  container.appendChild(heading);
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;';
  favs.forEach(l => grid.appendChild(renderListingCard(l, { noDelete: true })));
  container.appendChild(grid);
}

function renderCustomFolder(container, id) {
  const sc = customShortcuts.find(s => s.id === id);
  if (!sc) return;
  container.innerHTML = '';
  const listings = sc.listingIds.map(lid => allListings.find(l => l.id === lid)).filter(Boolean);
  const heading = document.createElement('div');
  heading.style.cssText = 'font-size:14px;font-weight:600;color:var(--text-muted);padding:0 0 16px;text-transform:uppercase;letter-spacing:0.06em;';
  heading.textContent = `${sc.name} – ${listings.length} listing${listings.length !== 1 ? 's' : ''}`;
  container.appendChild(heading);
  if (listings.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.style.margin = '0';
    empty.textContent = 'Drag listings here from the main view to add them to this folder.';
    container.appendChild(empty);
    return;
  }
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;';
  listings.forEach(l => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '✕ Remove shortcut';
    removeBtn.style.cssText = 'font-size:11px;padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);cursor:pointer;white-space:nowrap;align-self:center;';
    removeBtn.onmouseover = () => { removeBtn.style.color = 'var(--danger)'; removeBtn.style.borderColor = 'var(--danger)'; };
    removeBtn.onmouseout = () => { removeBtn.style.color = 'var(--text-muted)'; removeBtn.style.borderColor = 'var(--border)'; };
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      sc.listingIds = sc.listingIds.filter(id => id !== l.id);
      saveCustomShortcuts();
      buildShortcutSidebar();
      renderShortcutContent();
    };
    wrap.appendChild(renderListingCard(l, { noDelete: true }));
    wrap.appendChild(removeBtn);
    grid.appendChild(wrap);
  });
  container.appendChild(grid);
}

function initFilterBar() {
  const wrap = document.getElementById('filter-bar-wrap');

  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;';

  const textLabelEl = document.createElement('span');
  textLabelEl.textContent = 'Filter by text';
  textLabelEl.style.cssText = 'font-size:13px;color:var(--text-muted);white-space:nowrap;';

  const filterInput = document.createElement('input');
  filterInput.type = 'text';
  filterInput.id = 'filter-input';
  filterInput.placeholder = 'Enter text';
  filterInput.style.cssText = 'font-size:13px;padding:6px 12px;width:260px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);';
  filterInput.addEventListener('input', (e) => {
    filterText = e.target.value.toLowerCase().trim();
    pageIndexByDate = { '': 0 };
    refreshView();
  });

  const statusLabelEl = document.createElement('span');
  statusLabelEl.textContent = 'Filter by status';
  statusLabelEl.style.cssText = 'font-size:13px;color:var(--text-muted);white-space:nowrap;margin-left:8px;';

  const filterStatusOptions = [
    { value: '', label: 'All' },
    { type: 'group', label: 'Active' },
    { value: '__active__', label: 'Active (all)' },
    ...Object.entries(STATUS_DEFS).filter(([,d]) => d.group !== 'dead').map(([key,def]) => ({ value: key, label: def.label })),
    { type: 'group', label: 'Closed' },
    { value: '__closed__', label: 'Closed (all)' },
    ...Object.entries(STATUS_DEFS).filter(([,d]) => d.group === 'dead').map(([key,def]) => ({ value: key, label: def.label })),
  ];
  const filterStatusEl = createCustomSelect({
    options: filterStatusOptions,
    value: filterStatus,
    placeholder: 'All',
    onChange: (val) => { filterStatus = val; pageIndexByDate = { '': 0 }; refreshView(); },
  });

  filterBar.appendChild(textLabelEl);
  filterBar.appendChild(filterInput);
  filterBar.appendChild(statusLabelEl);
  filterBar.appendChild(filterStatusEl);


  const metroBtn = document.createElement('span');
  metroBtn.textContent = '🚇 Prague Metro Map';
  metroBtn.style.cssText = 'font-size:12px;color:#7a4a8a;cursor:pointer;user-select:none;white-space:nowrap;margin-left:auto;';
  metroBtn.onmouseover = () => metroBtn.style.color = '#ffd700';
  metroBtn.onmouseout = () => metroBtn.style.color = '#7a4a8a';
  metroBtn.onclick = openMetroMap;
  filterBar.appendChild(metroBtn);

  wrap.appendChild(filterBar);
}

initFilterBar();

loadListings();
</script>
</body>
</html>
